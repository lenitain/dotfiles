# mise 全局配置 — 根入口
# 文档: https://mise.jdx.dev/
#
# 分层拆分: conf.d/*.toml 按字母序自动加载并合并
#   conf.d/tools.toml     → [tools]              版本化工具 + 预发布白名单
#   conf.d/dotfiles.toml  → [dotfiles]           dotfile 声明式部署
#   conf.d/packages.toml  → [bootstrap.packages] 系统包
#   conf.d/system.toml    → [bootstrap.*]        系统配置(文件/服务/账号/登录 shell)
#   conf.d/mirrors.toml   → [env] + [settings]   下载镜像(唯一来源)
#   conf.d/hooks.toml     → [bootstrap.hooks]    声明式段覆盖不到的命令

[settings]
# 关闭自动安装: 缺工具时不再自动下载, 只警告, 装什么版本由我手动 `mise install` 决定。
# 原因: 进一个项目(比如 node)不该顺手把工具拉下来, 机器会越来越脏。
# 这同时关掉 exec_auto_install / not_found_auto_install / task.run_auto_install。
# 警告保留: status.missing_tools 保持默认 "if_other_versions_installed",
# 即"该工具有别的版本但缺这个版本"时仍会提示 missing, 提醒我去装。
auto_install = false
http_retries = 5
# 关闭最小发布年龄(默认 24h): 新版本发布即可用, 不再等 24 小时
# 必须是字符串 "0s"; 写成整数 0 会报 invalid type: integer `0`, expected a string
minimum_release_age = "0s"
# 不全局开 prereleases: 开了所有工具的 "latest" 都会含预发布, 而预发布版不刷新
# installs/<tool>/latest 软链, `mise upgrade` 会反复报同一个升级而实际版本不变。
# 需要预发布的工具在 conf.d/tools.toml 里单独打开。
dotfiles.root = "~/.config/mise/dotfiles"
dotfiles.default_mode = "symlink"
# 让 `mise bootstrap dotfiles add` 把新条目写进 conf.d/dotfiles.toml 而不是本文件。
# 不设的话 add 会往全局 config.toml 的 [dotfiles] 里塞条目, 破坏上面的分层拆分
# (conf.d 里已有的条目仍会合并生效, 但同一份声明散在两个文件里, 迟早对不上)。
# 只接受绝对路径或 ~/ 开头(相对路径不支持), 所以这里必须写全。
write_targets.dotfiles = "~/.config/mise/conf.d/dotfiles.toml"
