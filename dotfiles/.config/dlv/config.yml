# Configuration file for the delve debugger.
# Everforest Dark Medium theme

# Line numbers: grey0
source-list-line-color: "\x1b[90m"

# Syntax highlighting (Everforest semantic mapping)
# Keywords (red #E67E80) - conditional/loop/exception keywords
source-list-keyword-color: "\x1b[31m"
# Strings (green #A7C080)
source-list-string-color: "\x1b[32m"
# Numbers (purple #D699B6)
source-list-number-color: "\x1b[35m"
# Comments (grey1 #859289)
source-list-comment-color: "\x1b[90m"
# Arrow: current execution line indicator (orange #E69875)
# Everforest semantic: "Debugging Statements, Operators, Labels"
# Use true color for exact orange, or "\x1b[33m" for ANSI yellow fallback
source-list-arrow-color: "\x1b[38;2;230;152;117m"
# Tabs (grey0 #7A8478)
source-list-tab-color: "\x1b[90m"

# Prompt (green #A7C080) - primary accent color
prompt-color: "\x1b[32m"

# Stack trace: function names (green #A7C080)
# Everforest semantic: "Function Names, Method Names"
stacktrace-function-color: "\x1b[32m"

# Stack trace: path basename (aqua #83C092)
# Everforest semantic: "Constants, Macros" - subtle highlight for file paths
stacktrace-basename-color: "\x1b[36m"

# Uncomment to change what is printed instead of '\t'.
# tab: "... "

# Uncomment to change the number of lines printed above and below cursor when
# listing source code.
# source-list-line-count: 5

# Provided aliases will be added to the default aliases for a given command.
aliases:
  # command: ["alias1", "alias2"]

# Define sources path substitution rules. Can be used to rewrite a source path stored
# in program's debug information, if the sources were moved to a different place
# between compilation and debugging.
# Note that substitution rules will not be used for paths passed to "break" and "trace"
# commands.
# See also Documentation/cli/substitutepath.md.
substitute-path:
  # - {from: path, to: path}
  
# Maximum number of elements loaded from an array.
# max-array-values: 64

# Maximum loaded string length.
# max-string-len: 64

# Output evaluation.
# max-variable-recurse: 1

# Uncomment the following line to make the whatis command also print the DWARF location expression of its argument.
# show-location-expr: true

# Allow user to specify output syntax flavor of assembly, one of this list "intel"(default), "gnu", "go".
# disassemble-flavor: intel

# List of directories to use when searching for separate debug info files.
debug-info-directories: ["/usr/lib/debug/.build-id"]

# Uncomment to change how the current program position is displayed.
# Possible options
#  - 'source' always shows source code 
#  - 'disassembly' always show disassembly
#  - 'default' show disassembly after step-instruction, source otherwise
# position default

# Uncomment to change Delve's default prompt.
# The prompt string can contain various escape codes:
#  $d		inserts the current time in RFC3339 format
#  $d{fmt}	inserts the current time formatted with fmt (using the time package syntax)
#  $f		inserts the current frame number
#  $g		inserts the current goroutine ID
#  $t		inserts the current thread ID
#  $p		inserts the current PID
