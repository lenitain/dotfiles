[mgr]
ratio = [1,2,3]
sort_by ="extension"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "btime"
show_hidden = true
show_symlink = true

[preview]
wrap = "yes"
image_filter = "lanczos3"
max_width = 1000       # 预览图缓存的像素宽度上限，默认 600 会把图压到 600px

[tasks]
image_alloc = 1073741824        # = 1024*1024*1024 = 1024MB
