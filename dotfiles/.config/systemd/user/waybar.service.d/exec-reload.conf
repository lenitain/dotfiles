# service 自带的 ExecReload 是 `kill -SIGUSR2 $MAINPID`，但 SIGUSR2 在
# ~/.config/waybar/config 里被改成 on-sigusr2="hide"（overview 只在打开时显示
# waybar 需要它，见 ~/.config/niri/scripts/waybar-overview）。留着它，
# `systemctl --user reload waybar` 就会把 bar 藏起来而不是重读配置。
#
# 清空 ExecReload：reload 直接报错（"Job type reload is not applicable"），
# 不会静默做错事。重载请用 `systemctl --user restart waybar`
# 或 ~/.config/waybar/reload-config.sh。
[Service]
ExecReload=
