# 输入法环境变量——systemd --user 侧的保证。
#
# 与 ~/.config/niri/environment.kdl 里 Input method (fcitx5) 一节保持同值：
# 图形会话里的进程由 niri 注入，而 systemd --user 直接拉起的服务继承的是
# user manager 的环境——那份只来自这里。缺了它们的表现不是「转换不出来」，
# 而是输入法整块不加载（Qt 连插件都不加载）。
#
# dbus-broker 由 user manager socket 激活，同样继承这份环境，所以 D-Bus
# 激活的程序也一并覆盖。
GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
SDL_IM_MODULE=fcitx
INPUT_METHOD=fcitx
GLFW_IM_MODULE=ibus
