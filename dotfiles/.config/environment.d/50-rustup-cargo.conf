# Rust 工具链路径 — 与 conf.d/mirrors.toml [env] 的 MISE_RUSTUP_HOME/MISE_CARGO_HOME 同值。
#
# rustup/cargo 硬编码默认 ~/.rustup / ~/.cargo, 只认 RUSTUP_HOME / CARGO_HOME 环境变量,
# 而 mise 的 [env] 只在"经 mise 激活的 shell"里生效。systemd --user 拉起的服务
# 不经过 mise, 没有这两个变量就会把工具链写回 ~/.rustup、~/.cargo —— 这里兜住。
# (同值处仅剩 conf.d/mirrors.toml [env]; niri/environment.kdl 与 .profile 的写死副本已删, 勿再加。)
# ${HOME} 展开已实测可用 (systemd-environment-d-generator)。
RUSTUP_HOME=${HOME}/.local/share/rustup
CARGO_HOME=${HOME}/.local/share/cargo
