# Qt 无条件跟随 GTK——systemd --user 侧的保证。
#
# 图形会话里的进程由 ~/.config/niri/environment.kdl 覆盖；但 systemd --user
# 直接拉起的服务（如 qb-server）不经过 niri 的 environment 块，它们继承的是
# user manager 的环境，而 user manager 只在启动时读取 environment.d/。
# 两处保持同值，Qt 才在所有启动路径上都走 gtk3 平台主题。
QT_QPA_PLATFORMTHEME=gtk3
QT_QPA_PLATFORM=wayland
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
