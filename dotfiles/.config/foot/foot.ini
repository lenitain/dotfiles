# =============================================================================
# foot 配置 — Everforest Dark Medium 主题
# 生成于: foot 1.27.0
# =============================================================================

# Maple Mono NL NF CN 的 bold/italic 变体由 fontconfig 自动匹配
font = Maple Mono NL NF CN:size=16

# [selection] save_to_clipboard=true -> 选中即同时进剪贴板 + 主选择区
selection-target = both

[scrollback]
lines = 10000

# =============================================================================
# Everforest Dark Medium 配色
# =============================================================================
[colors-dark]
# [colors.primary]
background = 2D353B
foreground = D3C6AA
# [colors-dark.cursor]  foot 格式: cursor = <文字色> <光标背景色>
#   cursor.text=2D353B, cursor.cursor=D3C6AA
cursor = 2D353B D3C6AA
# [colors.normal]
regular0 = 475258
regular1 = E67E80
regular2 = A7C080
regular3 = DBBC7F
regular4 = 7FBBB3
regular5 = D699B6
regular6 = 83C092
regular7 = D3C6AA
# [colors.bright]
bright0 = 5d686f
bright1 = ff9798
bright2 = c0da99
bright3 = f6d698
bright4 = 98d5cc
bright5 = f1b2d0
bright6 = 9cdaab
bright7 = ede0c3

[cursor]
# style = Beam
style = beam

# -----------------------------------------------------------------------------
# 已内置、无需配置的对应项：
#   - 中键粘贴 (Middle -> PasteSelection)：foot 默认 BTN_MIDDLE -> primary-paste
#   - WINIT_X11_SCALE_FACTOR：foot 是 Wayland 原生缩放，不需要
#   - vi_mode_style：foot 没有 vi 模式（也没有正则搜索），无对应项
#   - decorations_theme_variant：跟随合成器主题，foot 无此选项
# -----------------------------------------------------------------------------