# psd (profile-sync-daemon) 配置 —— 完整文档见 `man 1 psd`。
# 只写显式覆盖项; 其余保持官方默认。可选值(尤其 BROWSERS 的完整浏览器清单)
# 不在这里复制, 查 man, 免得这份副本和上游脱节。

# 挂起前先把 tmpfs 里的 profile 回写磁盘, 减少异常掉电丢数据 (需 gdbus)
USE_SUSPSYNC="yes"
# 只管本机实际装了的浏览器
BROWSERS=("chromium" "qutebrowser")
# 保留崩溃恢复快照(内核 panic / 长按电源 / 电量耗尽等非正常关机时的兜底)
USE_BACKUPS="yes"
BACKUP_LIMIT="5"
