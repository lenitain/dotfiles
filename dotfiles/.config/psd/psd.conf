# psd (profile-sync-daemon) 配置 —— 完整文档见 `man 1 psd`。
# 只写显式覆盖项; 其余保持官方默认。可选值(尤其 BROWSERS 的完整浏览器清单)
# 不在这里复制, 查 man, 免得这份副本和上游脱节。
#
# 2026-11-14: 服务已停用 (`systemctl --user disable psd`)。
# 原因: psd 在关机 unsync 时 rsync 撞上 qutebrowser 删除 history.sqlite-wal,
# 返回 code 24 后整个 unsync 以 exit 2 放弃, 磁盘上留下新主库 + 旧 WAL,
# 导致 history.sqlite 报 "database disk image is malformed"。
# BROWSERS 有意写成非空: psd 把空值解释为"托管 /usr/share/psd/browsers 全部条目"。

# 挂起前先把 tmpfs 里的 profile 回写磁盘, 减少异常掉电丢数据 (需 gdbus)
USE_SUSPSYNC="yes"
# 本机 chromium 无 profile; qutebrowser 已不再交给 psd 托管
BROWSERS=("chromium")
# 保留崩溃恢复快照(内核 panic / 长按电源 / 电量耗尽等非正常关机时的兜底)
USE_BACKUPS="yes"
BACKUP_LIMIT="5"
