# 关闭上游 xdg-user-dirs-update 的自动创建/改写（用户级配置覆盖
# /etc/xdg/user-dirs.conf，两者逆序加载，后加载者胜）。
#
# 理由：该程序每次登录都会按 locale 建本地化目录（zh_CN 下是 ~/项目、~/模板），
# 并在任何已声明目录缺失时用 mkstemp + rename 重写 user-dirs.dirs —— 那会把
# dotfiles 的符号链接顶成普通文件，声明随之失效。
# 目录改由 `mise run setup-desktop` 按 user-dirs.dirs 内容派生，清单只有一处。
enabled=false
