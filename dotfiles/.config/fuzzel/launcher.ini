# Fuzzel 应用启动器 profile
#
# 由 fuzzel-wrapper 在调用方没给 --config 时补上（MOD+W 走的就是这条）。
# 主题、字体、内边距、颜色、通用按键见 common.ini；
# 剪贴板历史面板见 clipboard.ini、状态面板见 status.ini —— 三种用途的
# 宽度 / 行数 / 排序策略不同。

[main]
include=~/.config/fuzzel/common.ini

terminal=footclient -e

# 启动器：32 字符 ≈ 458 逻辑像素宽（1536 宽屏约 30%），
# 10 行 ≈ 410 逻辑像素高（实测 572x512 物理 @1.25）。
# 社区常见 30~36 字符 / 10~12 行；本机字号 16 比常见配置大，
# 字符数取小一些，视觉宽度才和常见截图相当。
width=32
lines=10

# 图标：走 icon-theme=default（hicolor，即各软件原厂 logo）
# 图标方案经实测 32/33 解析成功，保持现状
# icons-enabled 默认 yes
# icon-theme=default

# 不展开 desktop actions，保持一应用一行，避免列表翻倍
show-actions=no
# 搜索字段：在默认三项基础上补 comment / keywords
fields=filename,name,generic,comment,keywords
