# Fuzzel 配置文件 - Everforest Dark Medium 主题

[main]
# 字体设置（16px）
font=Noto Sans CJK SC:size=16

# 行高
line-height=25

# 图标设置
# icons-enabled=yes
# icon-theme=default

# 终端设置
terminal=footclient -e

# DPI 感知：no = 按缩放因子缩放，适配 HiDPI
dpi-aware=no

# 窗口大小
width=67
lines=17

# 窗口位置
anchor=center

# 内边距
horizontal-pad=23
vertical-pad=13
inner-pad=7

# 边框（与 git init 版本一致：radius=12 / width=2 / grey1）
[border]
radius=12
selection-radius=8
width=2

# Everforest Dark Medium 配色
# bg0:    #2D353B  bg1:    #343F44  bg2:    #3D484D
# bg3:    #475258  bg4:    #4F585E  fg:     #D3C6AA
# green:  #A7C080  aqua:   #83C092  grey1:  #859289
#
# 配色对齐 fcitx5 everforest-dark-medium 主题：
#   背景 #343f44 (bg1) / 选中行 #475258 (bg3) / 高亮 #a7c080 (green)

[colors]
# 背景色 - bg1（与 fcitx5 候选板 background.svg 同色）
background=343F44ff
# 文本色 - fg
text=D3C6AAff
# 提示符色 - green
prompt=A7C080ff
# 占位符色 - grey1
placeholder=859289ff
# 输入文本色 - fg
input=D3C6AAff
# 匹配字符高亮 - green（与 fcitx5 HighlightCandidateColor 同色）
match=A7C080ff
# 选中项背景色 - bg3（与 fcitx5 HighlightBackgroundColor 同色）
selection=475258ff
# 选中项文本色 - green（fcitx5 选中候选变绿，同 HighlightCandidateColor）
selection-text=A7C080ff
# 选中项匹配色 - aqua（与绿字略作区分）
selection-match=83C092ff
# 计数器色 - grey1
counter=859289ff
# 边框色 - grey1（2px 外边框）
border=859289ff

[key-bindings]
# Unbind default Control+k from delete-line-forward so we can use it for prev
delete-line-forward=none
prev=Up Control+k
next=Down Control+j
