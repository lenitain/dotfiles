# Fuzzel 配置文件 - Everforest Dark Medium 主题

[main]
# 字体设置（16px）
font=Noto Sans CJK SC:size=16

# 行高
line-height=25

# 图标设置
# icons-enabled=yes
# icon-theme=default

# 终端设置
terminal=footclient -e

# DPI 感知：no = 按缩放因子缩放，适配 HiDPI
dpi-aware=no

# 窗口大小
width=67
lines=17

# 窗口位置
anchor=center

# 内边距
horizontal-pad=23
vertical-pad=13
inner-pad=7

# 边框
[border]
radius=12
selection-radius=8
width=2

# Everforest Dark Medium 配色
# bg0:    #2D353B  bg1:    #343F44  bg2:    #3D484D
# bg3:    #475258  bg4:    #4F585E  fg:     #D3C6AA
# green:  #A7C080  aqua:   #83C092  grey1:  #859289

[colors]
# 背景色 - bg2（弹层/浮动窗口语义色）
background=3D484Dff
# 文本色 - fg
text=D3C6AAff
# 提示符色 - green
prompt=A7C080ff
# 占位符色 - grey1
placeholder=859289ff
# 输入文本色 - fg
input=D3C6AAff
# 匹配字符高亮 - aqua
match=83C092ff
# 选中项背景色 - bg_green
selection=425047ff
# 选中项文本色 - fg
selection-text=D3C6AAff
# 选中项匹配色 - green
selection-match=A7C080ff
# 计数器色 - grey1
counter=859289ff
# 边框色 - grey1（官方 UI Borders 语义色）
border=859289ff

[key-bindings]
# Unbind default Control+k from delete-line-forward so we can use it for prev
delete-line-forward=none
prev=Up Control+k
next=Down Control+j
