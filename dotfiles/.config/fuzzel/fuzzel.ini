# Fuzzel 配置 — Everforest Dark Medium 主题
#
# 颜色语义严格对应 ~/.palette/everforest.md（dark / medium），
# 并与 everforest-nvim 的 UI 高亮逐条对齐：
#
#   Pmenu       = fg      on bg2         弹出菜单背景 / 正文
#   Search Highlights = green             匹配字符
#   FloatBorder = grey1   on bg2          浮动窗口边框
#   PmenuThumb  = grey0                   前景类 UI 元素
#
# 例外：选中行不用 everforest 的 PmenuSel（statusline1 绿底 + bg0 字）。
#       选中用背景色 + 加粗表达，文字仍为 fg / green，
#       让「选中哪一行」（背景 + 字重）与「匹配哪些字符」（文字色）两个信号互不干扰。

[main]
# 字体（16px 与 waybar / fcitx5 一致）；Maple = 等宽 + CN(CJK) + NF(Nerd Font 图标)
font=Maple Mono NL NF CN:size=16
# 行高：无后缀时按 points 解析（25pt = 33.3px @96dpi）并随输出缩放，
# 因此两块屏（eDP 1.25 / HDMI 1.5）逻辑尺寸一致（实测面板 576 vs 573）。
# 勿写 25px 或 25pt —— 带后缀会退化为不缩放的设备像素，两块屏逻辑高度会差 77px。
line-height=25

# 图标：走 icon-theme=default（hicolor，即各软件原厂 logo）
# 图标方案经实测 32/33 解析成功，保持现状
# icons-enabled 默认 yes
# icon-theme=default

terminal=footclient -e

# no = 忽略显示器 DPI，按合成器缩放因子缩放
# （niri: eDP-1 scale 1.25 / HDMI-A-1 scale 1.5，字体随缩放翻倍）
dpi-aware=no

# 窗口尺寸：社区常见 width 30~40、lines 12~15
width=40
lines=15
anchor=center
layer=overlay

# 内边距（上游默认 40/8/0 偏空，社区普遍收窄）
horizontal-pad=24
vertical-pad=16
inner-pad=8

# 计数器默认不渲染，必须显式打开，否则 [colors].counter 是死配置
match-counter=yes
show-actions=no
# 选中行加粗：文字不变色后，加粗是唯一不占颜色的选中信号
use-bold=yes
# 搜索字段：在默认三项基础上补 comment / keywords
fields=filename,name,generic,comment,keywords

[border]
radius=12
selection-radius=8
width=2

[colors]
# 背景 bg2 #3D484D — Popup Menu / Floating Window Background
background=3D484Dff
# 正文 fg #D3C6AA — Default Foreground
text=D3C6AAff
# 提示符 green #A7C080 — Search Highlights
prompt=A7C080ff
# 占位符 grey1 #859289 — Comments
placeholder=859289ff
# 输入 fg #D3C6AA
input=D3C6AAff
# 匹配字符 green #A7C080 — Search Highlights
match=A7C080ff
# 选中行背景 bg4 #4F585E — 面板已是 bg2，bg4 在其上 1.30:1，
#   等同原 bg1+bg3 的 1.35:1；bg3 只剩 1.17:1 会看不出来
selection=4F585Eff
# 选中行文字 = 普通文字 fg #D3C6AA（不换色，选中靠背景 + 加粗）
selection-text=D3C6AAff
# 选中行匹配字符 = match green #A7C080（与未选中行一致）
selection-match=A7C080ff
# 计数器 grey1 #859289 — Status Line Text（位于输入行右端）
counter=859289ff
# 边框 grey1 #859289 — UI Borders，同 FloatBorder
border=859289ff

[dmenu]
# 脚本化调用（cliphist-fuzzel / power menu）在 stdin 为空时不弹窗
exit-immediately-if-empty=yes

[key-bindings]
# Unbind default Control+k from delete-line-forward so we can use it for prev
delete-line-forward=none
prev=Up Control+k
next=Down Control+j
