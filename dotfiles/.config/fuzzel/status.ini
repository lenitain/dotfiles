# Fuzzel 状态面板 profile
#
# 由 status-panel 通过 --config 显式加载（MOD+I）。主题、字体、颜色、按键
# 仍共享 common.ini —— 与启动器、剪贴板面板是同一套观感。
#
# 与另两个用途的差异：
#   - 更窄：读数都很短（"49% 󰁾 · 3h30"、"熄屏抑制 · 开 󰍹"），24 字符就够，
#     比启动器的 32 字符收一圈，不把卡片撑空
#   - minimal-lines：某一项取不到值时（没电池 / fcitx5 没起）窗口跟着缩，
#     不留一片空白
#   - sort-result=no：行序固定（电量 → 音量 → 输入法 → 熄屏抑制 → 时钟），
#     输入过滤时行也不许跳动，否则扫视的肌肉记忆就没了
#   - namespace=status：独立 layer namespace。`niri msg layers` 里能和启动器
#     （默认 namespace）区分开，将来要按 namespace 加 layer-rule 也有锚点
#
# 列的选择（--with-nth / --accept-nth）没有对应 ini 键，留在 status-panel 的
# 命令行上 —— 同 clipboard.ini 那边把 --with-nth=2 写在 cliphist-fuzzel 里。

[main]
include=~/.config/fuzzel/common.ini

width=24
lines=5
minimal-lines=yes
sort-result=no
namespace=status
