# Fuzzel 状态面板 profile
#
# 由 status 通过 --config 显式加载（MOD+SPACE）。主题、字体、颜色、按键
# 仍共享 common.ini —— 与启动器、剪贴板面板是同一套观感。
#
# 与另两个用途的差异：
#   - 更窄：读数都很短（"󰁾 49%"、"󰍹 熄屏抑制 · 开"、"󰖨 22% eDP-1"），24 字符就够，
#     比启动器的 32 字符收一圈，不把卡片撑空。图标是每行读数的第一个字符，
#     单独占一列对齐，宽度已经把它算进去了
#   - 行数不写死：fuzzel 的 lines 默认 15 只是上限，minimal-lines 让窗口贴着
#     实际条目数收缩 —— 某一项取不到值（没电池 / fcitx5 没起）就少一行
#   - sort-result=no：行序固定（录制 → 熄屏抑制 → 电量 → 亮度 → 音量 → 输入法 →
#     工作区 → 时钟），输入过滤时行也不许跳动，否则扫视的肌肉记忆就没了。
#     亮度不是固定一行：一块屏一行，屏按逻辑坐标从上到下排，行数随接的屏数变
#   - namespace=status：显式声明 layer 名。启动器那份不写（fuzzel 默认就叫
#     `launcher`），这里写死，`niri msg layers` 里一眼能认出这块是谁的窗口
#
# 列的选择（--with-nth / --accept-nth）没有对应 ini 键，留在 status 的
# 命令行上 —— 同 clipboard.ini 那边把 --with-nth=2 写在 cliphist-fuzzel 里。

[main]
include=~/.config/fuzzel/common.ini

width=24
minimal-lines=yes
sort-result=no
namespace=status
