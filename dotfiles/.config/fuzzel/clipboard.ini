# Fuzzel 剪贴板历史 profile
#
# 由 cliphist-fuzzel 通过 --config 显式加载（MOD+V）。启动器那份是
# launcher.ini，由 fuzzel-wrapper 兜底补上；两边的主题/颜色/按键共享 common.ini。
#
# 与启动器的关键差异：
#   - 更宽更高：剪贴板条目是整段文本/代码，需要更多横向与纵向空间
#   - minimal-lines：历史不足 17 条时窗口收缩，不显示大片空白
#   - sort-result=no：保持 cliphist 的新→旧顺序，输入过滤时行不跳动
#   - tabs=4：代码片段里的制表符按 4 空格展开，不浪费横向空间
#   - namespace=clipboard：独立 layer namespace，便于 `niri msg layers` 识别

[main]
include=~/.config/fuzzel/common.ini

width=60
lines=17
minimal-lines=yes
sort-result=no
tabs=4
namespace=clipboard

[dmenu]
# 历史为空时也弹出空窗口；否则 fuzzel 直接退出，按键看起来像"没反应"
exit-immediately-if-empty=no
