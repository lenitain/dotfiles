# video-note config. The installed copy lives at ~/.config/video-note/config.toml.
# Environment variables override this file; CLI flags override both.

[llm]
# deepseek / openai / openai_gpt4 / openai_gpt35 / qwen / glm / moonshot /
# minimax (MiniMax 境外站) / minimax_cn (MiniMax 国内站) / custom
provider = "minimax_cn"
# Only needed for custom; leave empty for built-in providers.
base_url = ""
model = ""
# Plain text on purpose: this is a personal, local-only setup.
# 置空就是置空：程序不会再去别处找 Key。要用环境变量里的 Key 就写 api_key_env。
api_key = ""
# 按量计费槽：不用，留空。
api_key_env = ""
# Token Plan 订阅 Key（与 api_key 是同一 provider 的另一种计费方式，端点相同、
# Key 不互通）。同样是置空即置空，要用环境变量就写 token_plan_key_env。
token_plan_key = ""
# 这个环境变量里放的是 Token Plan 订阅 Key（sk-cp- 开头）。
# 若你把订阅 Key 改放到 MINIMAX_CN_TOKEN_PLAN_API_KEY 里，就改成那个名字。
token_plan_key_env = "MINIMAX_CN_API_KEY"

[asr]
# base = faster-whisper 的基础多语言模型（模型约 140MB，速度较快，准确率一般）
# faster-whisper: tiny / base / small / medium / large-v3 / turbo / belle-turbo-zh
# 中文更推荐 paraformer-zh（CPU 快）或 small / belle-turbo-zh（更准）
model = "base"
# cpu / cuda
device = "cpu"

[bilibili]
# Needed for Bilibili AI subtitles. Public subtitles work without these.
# Export a Netscape cookies.txt from your browser and pass --cookie-file,
# or fill these values directly.
sessdata = ""
bili_jct = ""
buvid3 = ""

[output]
# 笔记和转录稿的保存目录；VIDEO_NOTE_OUTPUT_DIR 和 --out 会覆盖这里。
dir = "~/Documents/video-notes/"
# 这次要写哪几件成品：md-noimage 纯文字 Markdown / md-image 带插图的 Markdown /
# html 单文件 HTML。命令行点名任一成品开关就整份替换这份清单；
# 一个都不点名时用这里。环境变量：VIDEO_NOTE_OUTPUT_FORMATS（逗号分隔）。
formats = ["md-noimage", "html"]

[screenshots]
# 是否从视频画面抽帧并附在笔记末尾；命令行 --screenshots / --no-screenshots 可覆盖。
enabled = true
# 抽帧间隔（秒），5-300。
interval = 30
