# aria2 全局配置
# 本机环境实测结论：
#   - UDP 出口仅对少数 IP 放通，DHT bootstrap 节点 ping 不回，
#     所以 peer 发现只能靠 UDP tracker。
#   - 无 IPv6 默认路由（仅 link-local），tracker 返回 AAAA 时连接会挂起，
#     因此必须禁用 IPv6。
#   - /tmp 是 tmpfs（内存盘），写满时 aria2 会误报
#     「不可识别的 URI 或不支持的协议」，下载前请确认 /tmp 有空间。

# ── Tracker 列表 ──────────────────────────────────────────
# aria2 按 infohash 向各 tracker 查询，故对所有磁力链接通用。
# 以下 5 个已实测在本机网络下可连通并返回 peer：
# 注意：配置文件中同名选项重复出现会互相覆盖，必须用逗号分隔写在同一行。
bt-tracker=udp://open.stealth.si:80/announce,udp://open.demonii.com:1337/announce,udp://open.tracker.cl:1337/announce,udp://tracker.qu.ax:6969/announce,udp://tracker.ducks.party:1984/announce

# ── 网络 ──────────────────────────────────────────────────
# 本机没有 IPv6 默认路由，禁用后 aria2 只走 IPv4，避免连接挂起。
disable-ipv6=true

# 本机 DHT 引导节点不可达，保留 DHT 开关但不做引导；
# 磁力链接若自带 tr= 参数仍可正常工作。
enable-dht=true
dht-listen-port=6881-6999

# ── 做种策略 ───────────────────────────────────────────────
# aria2 默认 seed-ratio=1.0（上传量 = 下载量时自动停止做种并退出），
# seed-time 默认未设置（不做时间限制）。两者是「或」关系，任一满足即停。
#
# 想要无限做种，把下面这行改成 0.0：
#   seed-ratio=0.0   → 不添加任何停止条件，下载完成后会一直做种直到手动终止
# 想要限制做种时长（分钟），例如做种 7 天：
#   seed-time=10080
# 想要分享率达到 2.0 才停：
#   seed-ratio=2.0
#
# 注意：seed-ratio=0.0 与 seed-time 同时存在时，仍会按时间上限停止。
seed-ratio=0.0

# ── 其他 ───────────────────────────────────────────────────
# 不走本机 sing-box 代理：这些种子的 peer 多为国内 IP，
# 走代理反而更慢。需要代理时再用 --all-proxy 单独指定。
# 不要在此设置 continue=true —— 磁力链接没有控制文件时 aria2 会直接报错。
max-connection-per-server=16
