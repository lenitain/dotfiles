# ── 让“没有前缀的 i”直接上屏英文字母 i ─────────────────────────────
# 原理：把 i 从 speller/initials 里去掉。标准拼音里没有任何音节以 i 开头
#      （零声母的 yi/ya/ye/yin/ying… 都以 y 打头），所以 i 不能充当编码的
#      首字母；这时 Rime 不会接收这一次按键，按键被直接交给应用程序，
#      效果就是“按下 i 就出现英文字母 i”，不进入编码、不弹候选框。
#
# 生效范围：仅当 i 是本次编码的第一个键。
#   i        → 直接上屏英文字母 i
#   ni / shi / nihao → 照常拼音，完全不受影响
#
# 已知代价（可接受才保留）：
#   1. 以 i 开头的简码不可用：in→常年、it→传统、ic→尺寸、is→场所 …
#   2. 以 i 开头的英文单词不能在中文模式输入：in / it / is / input …
#      （会变成“i 直出 + 后面字母重新开始编码”）
#   3. 大写 I（Shift+i）仍走候选；将来若切换到双拼，i 是 ch 的声母键，
#      本改动会让双拼不可用，届时删掉本文件重新部署即可。
#
# 取消方法：删除本文件，或只删掉下面两行，然后重新部署（万象面板“部署”
#          或重启 fcitx5）即可恢复原状。
patch:
  speller/initials: "zyxwvutsrqponmlkjhgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA/"
