"~/.config/cliphist" = {}
"~/.config/dlv" = {}
"~/.config/fcitx5/conf/classicui.conf" = {}
"~/.config/fcitx5/profile" = {}
"~/.config/fish" = {}
"~/.config/fontconfig" = {}
"~/.config/foot" = {}
"~/.config/fuzzel" = {}
"~/.config/fzf" = {}
"~/.config/go/env" = {}
"~/.config/gtk-3.0" = {}
"~/.config/gtk-4.0" = {}
