# 镜像。mise 只管自己 HTTP 客户端；裸 git 走 ~/.gitconfig 的 url.insteadOf。

[env]
# Go 模块代理串联。挑镜像的四条硬标准（全部实测过）：
#   ① 要提供 /sumdb/ 端点 —— 否则 go 会直连被墙的 sum.golang.org 做校验，每个版本各等一次超时
#   ② 对"不存在的模块"必须返回 404 —— GOPROXY 链只认 404/410 才继续往后回退，
#      返回 200(空列表)或 403 会当场中断整条链
#   ③ miss 路径要快 —— mise 猜模块根时会连打 5 个前缀探测，镜像每个慢 10s 就直接爆 20s 预算
#   ④ 第一个代理必须能完成 TLS 握手 —— go 只在 404/410 时才试下一个代理；传输层错误
#      （TLS 握手超时、连接重置）会当场中断整条链，排在后面的镜像一个都用不上
# 实测（2026-11-28，本机）：goproxy.cn 的 443 端口 TCP 能连上但 TLS 握手永远不返回
#   （带/不带 SNI 都一样，明文 80 端口正常），即这个 CDN 边缘节点对本机不可用；
#   它在链首时，任何一次 go mod download 都是 "TLS handshake timeout" 直接失败。
#   因此 goproxy.cn 已从链里去掉 —— 它的缓存 TTL 只有 60s，本来就要经常回源 GitHub。
# 合格（.mod 耗时 / miss / sumdb/supported）：
#   mirrors.aliyun.com/goproxy  0.09s / 404 / 200   ← 首选
#   proxy.golang.com.cn          0.67s / 404 / 200
#   mirrors.tencent.com/go       0.20s / 404 / 200
# 淘汰：goproxy.cn（TLS 握手不通）、goproxy.io（@latest 返 403）、goproxy.baidu.com（miss 返 200）、
#       ustc/nju/bfsu（/goproxy/ 路径下没有这个模块）、sjtu（连不上）
# 注意：不要设 GOSUMDB。GOPROXY 里有代理时，go 会自动走 <proxy>/sumdb/<name>/，
# 手写 GOSUMDB=sum.golang.org 反而让它去请求 <proxy>/tile/… 而 404。
GOPROXY = "https://mirrors.aliyun.com/goproxy,https://proxy.golang.com.cn,https://mirrors.tencent.com/go,direct"
RUSTUP_DIST_SERVER = "https://mirrors.ustc.edu.cn/rust-static"
RUSTUP_UPDATE_ROOT = "https://mirrors.ustc.edu.cn/rust-static/rustup"
NODEJS_ORG_MIRROR = "https://npmmirror.com/mirrors/node"
NPM_CONFIG_REGISTRY = "https://registry.npmmirror.com"
PIP_INDEX_URL = "https://pypi.tuna.tsinghua.edu.cn/simple"
UV_DEFAULT_INDEX = "https://pypi.tuna.tsinghua.edu.cn/simple"
MISE_GO_DOWNLOAD_MIRROR = "https://mirrors.aliyun.com/golang"
# aliyun /golang 不发 .sha256（实测 404），不跳过校验会装不上。
# 代价是 Go 工具链包不做 SHA-256 校验；官方 dl.google.com/go 同机实测 25 MB/s 且有 .sha256，
# 想换回校验就删掉上面那行 MISE_GO_DOWNLOAD_MIRROR 和这行 skip_checksum。
MISE_GO_SKIP_CHECKSUM = "1"
MISE_HTTP_TIMEOUT = "5m"
MISE_HTTP_DOWNLOAD_TIMEOUT = "10m"

[settings]
# 末尾斜杠必须留；不要用 npmmirror 的 /mirrors/node（会被特判成 404）
node.mirror_url = "https://mirrors.aliyun.com/nodejs-release/"
# 查"工具最新版本"的总预算（默认 20s）。和 MISE_HTTP_TIMEOUT 是两回事：
# 那个是单个 HTTP 请求的超时，这个是整个版本查询的时限，超了就是 timed out。
fetch_remote_versions_timeout = "60s"
# 只管定版本，不管下载；配错不报错，会静默把 latest 钉在老版本
pypi.registry_url = "https://mirrors.aliyun.com/pypi/web/json/{}"

[settings.url_replacements]
"https://github.com/" = "https://gh-proxy.org/https://github.com/"
"https://raw.githubusercontent.com/" = "https://gh-proxy.org/https://raw.githubusercontent.com/"
"https://index.crates.io/" = "https://mirrors.ustc.edu.cn/crates.io-index/"
