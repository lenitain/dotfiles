# 下载镜像 —— 本文件是镜像配置的唯一来源, 其它文件不要再抄一遍同样的值。
#   [env]      注入 shell 和子进程, 各生态工具自己读
#   [settings] 只改 mise 自己 HTTP 客户端的请求目标
# 注意作用域: mise 只管经自己 HTTP 客户端的下载; 裸 git clone/fetch 不经过 mise,
# 由 ~/.gitconfig 的 url.insteadOf 改写 —— 两处换镜像时要同改。

[env]
# Go 模块 (go 后端装 gopls / dlv 等)
GOPROXY = "https://goproxy.cn,direct"
# Rust 工具链 (rustup) —— 这里只配镜像地址, 不配"装在哪"。
# rustup/cargo 用它们自己的默认位置 ~/.rustup / ~/.cargo (与 go 的 ~/go 同理)。
# 那两个位置只能靠 RUSTUP_HOME/CARGO_HOME 环境变量改, 而它们的 settings.toml /
# config.toml 又住在 store 里(鸡生蛋) —— 所以"搬去 XDG 目录"的代价是每条启动路径
# 都要分发变量(登录 shell / 图形会话 / systemd / IDE / launcher, 漏一处就坏)。
# 结论: 不搬, 用默认值, 全机零环境变量。
RUSTUP_DIST_SERVER = "https://mirrors.ustc.edu.cn/rust-static"
RUSTUP_UPDATE_ROOT = "https://mirrors.ustc.edu.cn/rust-static/rustup"
# node-gyp 构建原生模块时的 header 下载。mise 自己装 node 不读它, 见下方 node.mirror_url
NODEJS_ORG_MIRROR = "https://npmmirror.com/mirrors/node"
# npm (读 NPM_CONFIG_* 与 ~/.npmrc)
NPM_CONFIG_REGISTRY = "https://registry.npmmirror.com"
# pip / pipx / pypi 后端 (uv 走 UV_DEFAULT_INDEX)
PIP_INDEX_URL = "https://pypi.tuna.tsinghua.edu.cn/simple"
UV_DEFAULT_INDEX = "https://pypi.tuna.tsinghua.edu.cn/simple"

[settings]
# node 二进制下载 (默认 nodejs.org)。两个坑:
#   1. 不能写 npmmirror.com/mirrors/node —— mise 对它有特判, 会拼出缺 /node/ 和
#      -linux-x64 的 URL → 404
#   2. 末尾斜杠必须留 —— mise 按 URL join 拼版本目录, 没斜杠会把最后一段替换掉 → 404
# 留着不为速度, 只为 nodejs.org 抽风时可用(实测快慢随时在变, 别据此改配置)。
# SHASUMS256.txt + .sig 镜像里都有, 校验不受影响。想回直连就注掉这一行。
node.mirror_url = "https://cdn.npmmirror.com/binaries/node/"
# pypi 后端的版本查询 (默认 pypi.org/pypi/{}/json)
# 只管"定版本", 不管下载(下载走上面的 PIP_INDEX_URL / UV_DEFAULT_INDEX)。
# 换之前先验新鲜度, 这行坏了不报错, 只会静默把 latest 钉在老版本上:
#   curl -s <本行URL, 把 {} 换成包名> | grep -o '"version":"[^"]*"' | head -1
# tuna 的这个 JSON 接口落后很多(ruff 0.5.7 / debugpy 1.8.5, 实际 0.16.9 / 1.8.22),
# 但它的 simple index 是新鲜的 —— 所以只把定版本挪到 aliyun, 下载仍留 tuna。
pypi.registry_url = "https://mirrors.aliyun.com/pypi/web/json/{}"

# 按 URL 路由而非按后端: 凡经 mise HTTP 客户端访问 github.com 的后端
# (aqua / ubi / github / self-update) 都自动走镜像, 不必知道某工具用的哪个后端。
# 只匹配 https://github.com/, 故 api.github.com(版本查询 / attestation)不受影响。
# 校验不受影响: 下载后仍按 sha256 + GitHub attestations 验证。
# 任务脚本另走 tasks/lib/gh.sh(前缀式 gh-proxy, 带多镜像回退), 裸 git 走
# ~/.gitconfig。临时绕过: MISE_URL_REPLACEMENTS='{}' mise install <tool>
#
# crates 稀疏索引: cargo 后端的版本解析由 mise 自己发 HTTP 请求, 不经 cargo,
# 因此不受 cargo config 的 source 替换影响, 只能在这里路由到 USTC。
# (cargo config 部署在 ~/.cargo/config.toml, 见 conf.d/dotfiles.toml)
# 与 cargo 侧各配一份(那条管构建, 这条管版本查询), 换镜像时两处同改。
[settings.url_replacements]
"https://github.com/" = "https://gh-proxy.com/https://github.com/"
"https://index.crates.io/" = "https://mirrors.ustc.edu.cn/crates.io-index/"

# 已确认不需要配(免得日后重查):
#   go 运行时  默认 dl.google.com 够快; 阿里云 /golang 虽托管 tarball 但缺 .sha256,
#              而 mise 要下 <tarball>.sha256 校验 → 改过去直接装不上
#   zig        zig.use_community_mirrors 默认已生效, 会读上游 community-mirrors.txt
