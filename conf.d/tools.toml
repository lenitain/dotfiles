[tools]
# Zig
zig = "latest"
"aqua:zigtools/zls" = "latest"

# Go
go = "latest"
"aqua:mvdan/gofumpt" = "latest"
"aqua:golangci/golangci-lint" = "latest"
# Go 工具 (go 后端, 经 [env] GOPROXY 镜像)
"go:golang.org/x/tools/gopls" = "latest"
"go:github.com/go-delve/delve/cmd/dlv" = "latest"

# JS / TS
nodejs = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:@fsouza/prettierd" = "latest"
"npm:eslint_d" = "latest"

# AI agents
"npm:@earendil-works/pi-coding-agent" = "latest"

# Python
"npm:pyright" = "latest"
ruff = "latest"
"pipx:debugpy" = "latest"

# Lua
"aqua:LuaLS/lua-language-server" = "latest"
"aqua:JohnnyMorganz/StyLua" = "latest"

# ── 预发布工具：单独放行 prerelease ───────────────────────────────
# 全局 prereleases 已关闭（原因见 config.toml）。上游只发布预发布版的工具必须在这里
# 逐个打开 prerelease，否则会报 "no versions found ... matching date filter"。
#
# ⚠️ 这些子表必须放在文件末尾：TOML 子表会终止上面的 [tools] 表，
#    写在中间会把后面所有工具键吞进该子表里（静默丢失）。
[tools."npm:@deepseek-ai/dsh"]
version = "latest"
prerelease = true

# MiMoCode（Xiaomi，运行命令 mimo）。全局 minimum_release_age 内置默认 24h（防供应链），
# 而该包 registry 里目前只有 0.1.15 一个版本且发布不足 24h，会解析成
# "no versions found ... matching date filter"，故逐工具关掉发布时长过滤。
# 若之后想恢复 24h 保护（升级会滞后一天），删掉下面这行即可。
[tools."npm:@mimo-ai/cli"]
version = "latest"
minimum_release_age = "0s"
