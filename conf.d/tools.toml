[tools]
zig = "latest"
"aqua:zigtools/zls" = "latest"
go = "latest"
"go:mvdan.cc/gofumpt" = "latest"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:github.com/MichaelKinsy/PiG/cmd/pig" = "latest"
nodejs = "latest"
"npm:pnpm" = "latest"
bun = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:@fsouza/prettierd" = "latest"
"npm:eslint_d" = "latest"
"npm:pyright" = "latest"
ruff = "latest"
"aqua:LuaLS/lua-language-server" = "latest"
rust = [
  { version = "stable", profile = "default", components = ["rust-analyzer", "rust-src"], mr_boxington = true },
  { version = "nightly", profile = "minimal", components = ["miri", "rust-src"], mr_boxington = true },
]
"mr-boxington" = "latest"
"cargo:jj-gh" = "latest"
"cargo:typos-cli" = "latest"
"cargo:wireforge" = "latest"
"cargo:wrfm-cli" = "latest"
"github:HalFrgrd/flyline" = "latest"
"github:whoamihappyhacking/just-talk-go" = "latest"
zmx = "latest"

# ── 预发布白名单: 上游只发预发布版的工具在这里逐个打开 prerelease ──
# 全局 prereleases 是关的, 原因见 config.toml。
# ⚠️ 子表必须留在文件末尾: TOML 子表会终止上面的 [tools], 写在中间会把后续
#    工具键吞进子表里(静默丢失)。
[tools."npm:@deepseek-ai/dsh"]
version = "latest"
prerelease = true
