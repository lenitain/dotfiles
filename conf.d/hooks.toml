# 一次性/后续 hooks：声明式段覆盖不到的命令
# 挂到 dotfiles 收敛后：重建 bat 语法高亮缓存（幂等，bat 未装则跳过）

[bootstrap.hooks.post-dotfiles]
run = "command -v bat >/dev/null 2>&1 && bat cache --build || true"

# pre-packages (数组, mise 按数组下标顺序执行):
#   [1] sudo pacman -Syu — 同原本: 装缺包只发 `pacman -S --needed` 不刷同步库,
#       库比系统新 = Arch 不支持的 partial upgrade。这步失败会中止 bootstrap,
#       packages 不会在危险态下执行。注意 `packages apply/use` 等分部命令不经过 hooks。
#   [2] `command -v flatpak || sudo pacman -S --needed --noconfirm flatpak` —
#       时序兜底。pre-packages 跑在 packages apply 之前, 步骤 3 要 flatpak CLI。
#       后续 packages apply 仍按本文件 `pacman:flatpak` --needed 声明再 install 一次
#       (no-op, 已装即跳过)。声明单一来源在 conf.d/packages.toml, 这条只为首次 bootstrap
#       让 CLI 在 hook 期间可用, 不是重复定义。
#   [3] flathub 用户源 + GPG — sjtu 镜像, --gpg-import 必带 (flatpak 的"每 remote
#       自带 trust root"模型无像 archlinux-keyring 那种 keyring 包可走, 详见项目内
#       相关对照讨论)。失败硬中止 packages; 等同于原 tasks/setup-flatpak "硬失败" 语义。
[bootstrap.hooks.pre-packages]
run = [
  "sudo pacman -Syu --noconfirm",
  "command -v flatpak >/dev/null 2>&1 || sudo pacman -S --needed --noconfirm flatpak",
  """
    set -euo pipefail
    tmp_key="$(mktemp)"
    trap 'rm -f "$tmp_key"' EXIT
    curl -fsSL -o "$tmp_key" https://mirror.sjtu.edu.cn/flathub/flathub.gpg
    if ! flatpak remote-list --user | grep -q '^flathub'; then
      flatpak remote-add --user flathub https://mirror.sjtu.edu.cn/flathub --gpg-import="$tmp_key"
    else
      flatpak remote-modify --user flathub --gpg-import="$tmp_key"
    fi
  """,
]
