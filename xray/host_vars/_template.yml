---
# 新 VPS 模板:复制为 host_vars/<新IP>.yml 并填入变量即可。
# 也可以用 scripts/gen-keys.py <新IP> 一键生成(推荐)。

xray_port: 8443
xray_dest: "www.cloudflare.com:443"
xray_server_names:
  - "www.cloudflare.com"

# ---- 密钥(填一次;每台 VPS 用各自的一套,不要共用) ----
xray_uuid: ""
xray_private_key: ""
xray_public_key: ""
xray_short_id: ""
